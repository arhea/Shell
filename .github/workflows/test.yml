# Builds Shell and runs the unit tests on every pull request to main, and on
# pushes to main so the branch's status stays visible.
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per PR (or per push to main); a new push cancels the stale run.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # Apple Silicon, macOS 26, Xcode 26.x (Shell needs Xcode 26+ and arm64).
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Read pinned Ghostty commit
        id: ghostty
        run: echo "commit=$(sed -n 's/^GHOSTTY_COMMIT="\(.*\)"$/\1/p' scripts/bootstrap.sh)" >> "$GITHUB_OUTPUT"

      # libghostty takes several minutes to build; reuse it until the pinned
      # commit changes.
      - name: Restore libghostty
        id: libghostty
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Vendor/GhosttyKit.xcframework
            Vendor/GhosttyResources
            Vendor/.ghostty-built-*
          key: libghostty-${{ runner.os }}-${{ runner.arch }}-${{ steps.ghostty.outputs.commit }}

      # Only needed to build libghostty. Our own action: official ziglang.org
      # tarball, checked against a pinned SHA-256. When the Ghostty bump changes
      # minimum_zig_version (Vendor/ghostty/build.zig.zon), update both values
      # from https://ziglang.org/download/index.json.
      - name: Set up Zig
        if: steps.libghostty.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
          sha256: b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Bootstrap
        run: ./scripts/bootstrap.sh

      # Ad-hoc signing with no team, so no Apple Developer account or secrets
      # are needed (same as a contributor's Debug build).
      - name: Run tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Shell.xcodeproj \
            -scheme Shell \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            2>&1 | tee build/xcodebuild-test.log \
            | grep -E '^/.*(error|warning):|Test Case .* failed|Executed [0-9]+ tests|\*\* (TEST|BUILD) (SUCCEEDED|FAILED) \*\*'

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            build/TestResults.xcresult
            build/xcodebuild-test.log
          retention-days: 14
