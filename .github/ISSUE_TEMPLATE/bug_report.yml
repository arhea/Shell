name: Bug report
description: Something in Shell doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please check `docs/troubleshooting.md` in this repository and search existing issues first.

        **Security issues:** don't file them here. Report them privately from the repository's **Security** tab, as described in `SECURITY.md`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new tab in a git repository
        2. Type `...`
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Terminal rendering or input
        - Native prompt or completions
        - Tabs, splits or windows
        - Claude Code or Codex
        - Git, worktrees or GitHub sidebar
        - Homebrew, Node.js, Zsh or Go managers
        - Apple Intelligence
        - Shortcuts, widget or other macOS integration
        - Settings or themes
        - Building from source
        - Other
    validations:
      required: true
  - type: input
    id: shell-version
    attributes:
      label: Shell version
      description: Shell › About Shell, or the commit if you built from source.
      placeholder: 0.1.0 (1)
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Output of `sw_vers -productVersion`.
      placeholder: "15.5"
    validations:
      required: true
  - type: input
    id: tools
    attributes:
      label: Relevant tool versions
      description: Any that apply, such as `zsh --version`, `claude --version`, `codex --version`, `gh --version`.
  - type: textarea
    id: diagnostics
    attributes:
      label: Logs, screenshots or diagnostic snapshot
      description: |
        A `"$SHELL_APP_CTL" debug snapshot <dir>` report helps a lot. It includes the text on screen in every pane, so **remove secrets before attaching**.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this hasn't been reported.
          required: true
        - label: I reproduced this on the latest release (or `main`).
